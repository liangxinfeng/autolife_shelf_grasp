# 部署配置；ROBOT_ID环境变量可覆盖编号。资源相对本目录上级解析。
# 最大开口90毫米采用已接受的参考曲线，非本机实测。
geometry_source: urdf
robot_id: 367
# 与本机已有的 VR 控制器共同使用。迁移时填写目标控制器的锁文件名。
vr_arm_lock_name: vr345-arm-control.lock
arm: left
# python未配置时使用启动本程序的解释器。
vendor_python_path: /home/ubuntu/autolife-v3/env/lib/python3.12/site-packages
urdf_path: urdf/robot_v3_1.urdf
calibration: calibration/left/session.json
right_calibration: calibration/right/session.json
detector_backend: grounded_sam2
grounding_dino_model: models/grounding-dino-tiny
sam2_model: models/sam2.1-hiera-tiny
grounded_box_threshold: 0.35
grounded_text_threshold: 0.2
sam2_mask_quality: 0.5
dino_repo: models/dinov2
dino_weights: models/dinov2_vits14_pretrain.pth
device: cuda:0
image_size: 640
confidence: 0.3
grounded_sam2_prompts:
  beverages: bottle. beverage can. cup.
  all: bottle. cup. can. bag. box. watermelon. crumpled tissue. crumpled paper. sponge.
    cloth. mobile phone. mouse. remote control. key. pen. book.
recognition_hz: 3.0
match_threshold: 0.72
match_margin: 0.06
depth_scale_m: 0.001
depth_range_m:
- 0.2
- 1.8
head_offsets_deg:
- 0.0
- 0.0
- 0.0
tcp_offset_mm: 15.0
target_offset_torso_mm:
- 0.0
- 0.0
- 0.0
T_wrist_tool_quat_xyzw:
- -0.70710678
- 0.0
- 0.0
- 0.70710678
approach_yaw_deg: 0.0
orientation_relax_deg: 30.0
pregrasp_m: 0.12
lift_m: 0.035
withdraw_m: 0.2
fixed_carry_enabled: true
carry_return_mode: continuous_reset
carry_max_tilt_deg: 45.0
gripper_max_width_m: 0.09
gripper_hardware: dm_type1
gripper_width_calibration: config/gripper_width.json
gripper_open_deg: 10.0
gripper_open_tolerance_deg: 4.0
gripper_closed_deg: 330.0
initial_pose_deg:
  left_arm:
  - 20.0
  - 0.0
  - 0.0
  - -110.0
  - 0.0
  - 0.0
  - 0.0
  right_arm:
  - 20.0
  - 0.0
  - 0.0
  - -110.0
  - 0.0
  - 0.0
  - 0.0
  neck:
  - 0.0
  - 0.0
  - 0.0
require_reset_before_grasp: false
reset_hardware_enabled: true
supported_neck_recovery_enabled: true
reset_joint_speed_deg_s: 70.2
reset_joint_acceleration_deg_s2: 585.0
reset_feedback_lead_deg: 5.0
reset_tolerance_deg: 1.0
gripper_speed_scale: 0.5
max_joint_speed_deg_s: 120.0
max_joint_acceleration_deg_s2: 720.0
grasp_feedback_lead_deg: 3.0
grasp_transit_feedback_lead_deg: 5.0
use_position_sync_session: true
plan_ttl_sec: 20.0
hardware_execution: true
supervised_experiment: true
camera_tcp_validated: false
gripper_mapping_validated: false
tool_orientation_validated: false
external_scene_validated: false
vendor_control_config: /home/ubuntu/autolife-v3/env/lib/python3.12/site-packages/autolife_robot_arm/configs/autolife_s1/robot_v3_1.json
grasp_backend: vendor_ik_trajectory
# 原地识别后的双臂完整路径总规划时间；含预判，默认兼容值为10秒。
stationary_plan_budget_sec: 25.0
vendor_grasp_waist_range_deg:
- 12.0
- 8.0
vendor_grasp_arm_speed_deg_s: 60.0
vendor_grasp_waist_speed_deg_s: 20.0
low_object_height_m: 0.1
low_object_pitch_candidates_deg:
- 35.0
- 45.0
- 55.0
- 65.0
- 75.0
low_object_table_clearance_m: 0.01
low_object_finger_contact_fraction: 0.8
grasp_opening_margin_mm: 10.0
camera_protocol: ALSHM001

# 姿态/动作夹爪直接使用原厂位置量，10为最大张开，数值增大趋向闭合；不需要毫米标定。
pose_gripper_units: native
